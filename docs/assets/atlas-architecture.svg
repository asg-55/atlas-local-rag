<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Техническая архитектура Atlas</title>
  <desc id="desc">Компоненты локального RAG-конвейера от входных файлов до ответа с источниками</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6Z" fill="#737373"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1400" height="760" rx="30" fill="#f4f4f3"/>
  <text x="64" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#171717">Архитектура: один запрос — несколько специализированных контуров</text>
  <text x="64" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#666">Все компоненты работают локально; наружу не отправляются ни документы, ни история, ни промпты.</text>
  <g stroke="#737373" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M270 252H343"/><path d="M587 252H660"/><path d="M904 252H977"/><path d="M1221 252H1280"/>
    <path d="M465 331V420"/><path d="M782 331V420"/><path d="M1099 331V420"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(60 172)"><rect width="210" height="160" rx="20" fill="#fff" stroke="#d8d8d5"/><text x="24" y="38" font-size="15" font-weight="700" fill="#777">01 · ВХОД</text><text x="24" y="73" font-size="20" font-weight="700" fill="#171717">Единый чат</text><text x="24" y="103" font-size="15" fill="#555">Вопрос + история</text><text x="24" y="127" font-size="15" fill="#555">Файлы и вложения</text></g>
    <g transform="translate(343 172)"><rect width="244" height="160" rx="20" fill="#202020"/><text x="24" y="38" font-size="15" font-weight="700" fill="#aaa">02 · МАРШРУТИЗАЦИЯ</text><text x="24" y="73" font-size="20" font-weight="700" fill="#f2f2f2">Определение задачи</text><text x="24" y="103" font-size="15" fill="#c8c8c8">Разговор · RAG · анализ</text><text x="24" y="127" font-size="15" fill="#c8c8c8">Код · уточнение контекста</text></g>
    <g transform="translate(660 172)"><rect width="244" height="160" rx="20" fill="#fff" stroke="#d8d8d5"/><text x="24" y="38" font-size="15" font-weight="700" fill="#777">03 · ПОИСК</text><text x="24" y="73" font-size="20" font-weight="700" fill="#171717">Hybrid Retrieval</text><text x="24" y="103" font-size="15" fill="#555">FAISS + BM25 / FTS5</text><text x="24" y="127" font-size="15" fill="#555">RRF + cross-encoder</text></g>
    <g transform="translate(977 172)"><rect width="244" height="160" rx="20" fill="#202020"/><text x="24" y="38" font-size="15" font-weight="700" fill="#aaa">04 · ГЕНЕРАЦИЯ</text><text x="24" y="73" font-size="20" font-weight="700" fill="#f2f2f2">Локальная LLM</text><text x="24" y="103" font-size="15" fill="#c8c8c8">Ollama или llama.cpp</text><text x="24" y="127" font-size="15" fill="#c8c8c8">Qwen 3.5 · GGUF Q4</text></g>
    <g transform="translate(1280 192)"><rect width="70" height="120" rx="18" fill="#ececec" stroke="#ccc"/><path d="m35 26 18 18-18 18-18-18Z" fill="none" stroke="#171717" stroke-width="4"/><path d="m35 38 6 6-6 6-6-6Z" fill="#171717"/><text x="35" y="92" font-size="13" text-anchor="middle" font-weight="700" fill="#171717">Ответ</text><text x="35" y="108" font-size="10" text-anchor="middle" fill="#555">+ ссылки</text></g>
    <g transform="translate(60 420)"><rect width="366" height="244" rx="22" fill="#fff" stroke="#d8d8d5"/><text x="24" y="42" font-size="18" font-weight="700" fill="#171717">Парсинг и извлечение</text><text x="24" y="76" font-size="15" fill="#555">PyMuPDF · python-docx · pandas</text><text x="24" y="102" font-size="15" fill="#555">openpyxl · LibreOffice · PyAV</text><rect x="24" y="130" width="318" height="1" fill="#e2e2e2"/><text x="24" y="164" font-size="14" font-weight="700" fill="#777">ФОРМАТЫ</text><text x="24" y="193" font-size="15" fill="#333">PDF · Office · XLSX · CSV · JSON</text><text x="24" y="219" font-size="15" fill="#333">Изображения · аудио · текст</text></g>
    <g transform="translate(517 420)"><rect width="366" height="244" rx="22" fill="#fff" stroke="#d8d8d5"/><text x="24" y="42" font-size="18" font-weight="700" fill="#171717">ML-контур документов</text><text x="24" y="76" font-size="15" fill="#555">multilingual-e5-base · 768 dim</text><text x="24" y="102" font-size="15" fill="#555">mMARCO MiniLM reranker</text><rect x="24" y="130" width="318" height="1" fill="#e2e2e2"/><text x="24" y="164" font-size="14" font-weight="700" fill="#777">МЕДИА</text><text x="24" y="193" font-size="15" fill="#333">EasyOCR + OpenCV</text><text x="24" y="219" font-size="15" fill="#333">faster-whisper</text></g>
    <g transform="translate(974 420)"><rect width="366" height="244" rx="22" fill="#fff" stroke="#d8d8d5"/><text x="24" y="42" font-size="18" font-weight="700" fill="#171717">Локальное состояние</text><text x="24" y="76" font-size="15" fill="#555">SQLite + WAL · история · задания</text><text x="24" y="102" font-size="15" fill="#555">FAISS index · оригиналы файлов</text><rect x="24" y="130" width="318" height="1" fill="#e2e2e2"/><text x="24" y="164" font-size="14" font-weight="700" fill="#777">МАСШТАБ</text><text x="24" y="193" font-size="15" fill="#333">50–100 тыс. фрагментов</text><text x="24" y="219" font-size="15" fill="#333">Фоновая очередь индексации</text></g>
  </g>
</svg>
