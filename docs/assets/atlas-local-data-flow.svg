<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Локальный жизненный цикл данных Atlas</title>
  <desc id="desc">Документы остаются на компьютере и обрабатываются локальными компонентами</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6Z" fill="#8b8b8b"/></marker></defs>
  <rect width="1400" height="520" rx="30" fill="#1b1b1b"/>
  <text x="64" y="72" fill="#f0f0f0" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Данные не покидают компьютер</text>
  <text x="64" y="105" fill="#aaa" font-family="Segoe UI, Arial, sans-serif" font-size="16">Local-first архитектура: хранение, поиск, OCR и генерация выполняются внутри одного доверенного контура.</text>
  <rect x="50" y="138" width="1300" height="320" rx="24" fill="#222" stroke="#424242" stroke-dasharray="9 8"/>
  <text x="78" y="176" fill="#777" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">КОМПЬЮТЕР ПОЛЬЗОВАТЕЛЯ · 127.0.0.1</text>
  <g stroke="#8b8b8b" stroke-width="2.5" marker-end="url(#a)"><path d="M310 302H400"/><path d="M662 302H752"/><path d="M1014 302H1104"/></g>
