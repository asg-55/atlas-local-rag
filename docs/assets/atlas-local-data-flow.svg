    <g transform="translate(88 217)"><rect width="222" height="170" rx="20" fill="#303030" stroke="#484848"/><text x="22" y="42" fill="#aaa" font-size="13" font-weight="700">МАТЕРИАЛЫ</text><text x="22" y="78" fill="#f0f0f0" font-size="19" font-weight="700">Документы</text><text x="22" y="108" fill="#ccc" font-size="14">Таблицы · сканы</text><text x="22" y="133" fill="#ccc" font-size="14">Аудио · рабочий код</text></g>
    <g transform="translate(400 217)"><rect width="262" height="170" rx="20" fill="#ececec"/><text x="22" y="42" fill="#666" font-size="13" font-weight="700">ЛОКАЛЬНАЯ ОБРАБОТКА</text><text x="22" y="78" fill="#171717" font-size="19" font-weight="700">Atlas backend</text><text x="22" y="108" fill="#444" font-size="14">Python · OCR · embeddings</text><text x="22" y="133" fill="#444" font-size="14">RAG · маршрутизация</text></g>
    <g transform="translate(752 217)"><rect width="262" height="170" rx="20" fill="#303030" stroke="#484848"/><text x="22" y="42" fill="#aaa" font-size="13" font-weight="700">ЛОКАЛЬНЫЙ INFERENCE</text><text x="22" y="78" fill="#f0f0f0" font-size="19" font-weight="700">Qwen 3.5</text><text x="22" y="108" fill="#ccc" font-size="14">Ollama · Docker edition</text><text x="22" y="133" fill="#ccc" font-size="14">llama.cpp · Desktop</text></g>
    <g transform="translate(1104 217)"><rect width="208" height="170" rx="20" fill="#303030" stroke="#484848"/><text x="22" y="42" fill="#aaa" font-size="13" font-weight="700">РЕЗУЛЬТАТ</text><text x="22" y="78" fill="#f0f0f0" font-size="19" font-weight="700">Ответ</text><text x="22" y="108" fill="#ccc" font-size="14">Источники · XLSX</text><text x="22" y="133" fill="#ccc" font-size="14">Код · защищённый файл</text></g>
  </g>
  <g transform="translate(1185 64)" font-family="Segoe UI, Arial, sans-serif"><rect width="165" height="42" rx="21" fill="#ececec"/><circle cx="24" cy="21" r="8" fill="#171717"/><path d="m24 16 5 5-5 5-5-5Z" fill="#ececec"/><text x="44" y="27" fill="#171717" font-size="14" font-weight="700">NO CLOUD API</text></g>
